name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gis]"
      - run: ruff check .
      - run: pytest
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///ci.sqlite3
          SECRET_KEY: ci-secret
          JWT_SECRET_KEY: ci-jwt-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  production-deployment-artifacts:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ci
      SECRET_KEY: ci-only-dummy-secret
      JWT_SECRET_KEY: ci-only-dummy-jwt-secret
      POSTGRES_PASSWORD: ci-only-dummy-database-password
      DATABASE_URL: postgresql+psycopg://esr:ci-only-dummy-database-password@db:5432/esr_platform
      ESR_SOURCE_RASTER_HOST_DIR: /tmp/esr-source
      VITE_AMAP_JS_API_KEY: ci-only-dummy-amap-key
      VITE_AMAP_SECURITY_JS_CODE: ci-only-dummy-amap-security-code
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build --target production --tag esr-platform-backend:ci ./backend
      - name: Build frontend production image
        run: >-
          docker build
          --target production
          --tag esr-platform-frontend:ci
          --build-arg VITE_API_BASE_URL=/api/v1
          --build-arg VITE_AMAP_JS_API_KEY="$VITE_AMAP_JS_API_KEY"
          --build-arg VITE_AMAP_SECURITY_JS_CODE="$VITE_AMAP_SECURITY_JS_CODE"
          ./frontend
      - name: Validate production Compose configuration
        run: docker compose -f compose.production.yml config --quiet
      - name: Run isolated PostGIS migration and readiness gate
        shell: pwsh
        run: ./scripts/release-gate.ps1 -BackendImage esr-platform-backend:ci
