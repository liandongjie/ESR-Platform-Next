[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esr-platform-backend"
version = "0.1.0"
description = "Backend service for ESR-Platform-Next"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-Cors>=6.0,<7.0",
    "Flask-JWT-Extended>=4.7,<5.0",
    "Flask-Migrate>=4.1,<5.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "GeoAlchemy2>=0.18,<1.0",
    "celery[redis]>=5.5,<6.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "redis>=6.0,<7.0",
]

[project.optional-dependencies]
gis = [
    "geopandas>=1.1,<2.0",
    "numpy>=2.2,<3.0",
    "pyproj>=3.7,<4.0",
    "rasterio>=1.4,<2.0",
    "shapely>=2.1,<3.0",
]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
